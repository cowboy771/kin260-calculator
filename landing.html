<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kin260 — Calculate Your Codes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=IM+Fell+English:ital@0;1&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing-main.jsx"></script>
    <script>
      (function () {
        // Same iframe auto-resize approach as index.html — see the
        // comment there for the full explanation. Kept in sync manually
        // since this is a separate HTML entry point.
        function sendHeight() {
          var height = document.documentElement.scrollHeight;
          window.parent.postMessage({ type: 'kin260-resize', height: height }, '*');
        }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
        if (window.ResizeObserver) {
          new ResizeObserver(sendHeight).observe(document.body);
        }
        new MutationObserver(sendHeight).observe(document.body, {
          childList: true, subtree: true, attributes: true,
        });
        setTimeout(sendHeight, 300);
        setTimeout(sendHeight, 1000);
      })();
    </script>
  </body>
</html>
